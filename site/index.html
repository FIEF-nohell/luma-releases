<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luma</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    box-sizing: border-box; background: #0E0E13; color: #9090A6; font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  main { width: 100%; max-width: 640px; }
  p { margin: 0 0 8px; }
  .row { display: flex; gap: 8px; margin-bottom: 24px; }
  code {
    flex: 1; background: #21212C; color: #EEEEF8; border-radius: 8px; padding: 10px 12px;
    font: 13px/1.4 "Cascadia Mono", Consolas, monospace; overflow-x: auto; white-space: nowrap;
  }
  button {
    background: #A99BFF; color: #14121F; border: 0; border-radius: 8px; padding: 0 14px;
    font: 600 13px "Segoe UI", system-ui, sans-serif; cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <p>Install or update (PowerShell)</p>
  <div class="row"><code>irm https://getluma.nohelll.com/script/install.ps1 | iex</code><button type="button">Copy</button></div>
  <p>Uninstall (PowerShell)</p>
  <div class="row"><code>$env:LUMA_UNINSTALL="1"; irm https://getluma.nohelll.com/script/install.ps1 | iex</code><button type="button">Copy</button></div>
</main>
<script>
  document.querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", async function () {
      try { await navigator.clipboard.writeText(b.previousElementSibling.textContent); b.textContent = "Copied"; }
      catch (e) { b.textContent = "Failed"; }
      setTimeout(function () { b.textContent = "Copy"; }, 1500);
    });
  });
</script>
</body>
</html>
